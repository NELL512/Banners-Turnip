name: Build Turnip for Poco F1

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build patchelf unzip curl python3-pip \
            flex bison zip git perl ccache glslang-tools

          pip3 install --user meson mako
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Turnip
        run: |
          chmod +x build-turnip.sh
          ./build-turnip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-PocoF1-Android10
          path: |
            turnip_workdir/Turnip-*.zip
